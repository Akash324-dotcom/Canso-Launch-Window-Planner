name: publish-api-image

# Builds the API image, checks that it starts and answers, then publishes it to GitHub Container Registry.
# Runs on every push to the `deploy` branch, or by hand from the Actions tab.
on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry names must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/canso-launch-api" >> "$GITHUB_ENV"

      - name: Build
        run: docker build -t "$IMAGE:latest" .

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE:latest"
          curl --retry 15 --retry-delay 2 --retry-connrefused -fsS http://localhost:8000/v1/site > /dev/null
          curl -fsS "http://localhost:8000/v1/decision/delay-cost?p=0.5,0.5,0.5&c_day=2000" | grep -q '"expected_extra_days"'
          docker logs api | tail -5

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish
        run: docker push "$IMAGE:latest"
